# Non-secret Lattice settings (models, timezone, tools, …).
# Secrets → project .env only
# Runtime data → .lattice/

timezone: Asia/Jakarta

agent:
  primary_model: deepseek/deepseek-v4.1-flash
  secondary_model: openai/gpt-oss-120b
  auxiliary_model: openai/gpt-oss-120b
  secondary_max_iterations: 8
  iteration_budget: 40
  hitl_timeout_seconds: 600
  workspace: null
  # Whole-turn routing: classifier picks LOW (user-facing worker) or HIGH (primary).
  orchestrator:
    enabled: true
    classifier_model: null   # default: resolved primary
    worker_model: null       # default: secondary_model
    classifier_max_tokens: null   # null = no cap (a cap can truncate the routing JSON)
    classifier_timeout_seconds: 12   # classifier deadline; timeout → fail-safe HIGH
    classifier_input_chars: 2000     # truncate user text sent to the classifier
    worker_timeout_seconds: 30       # LOW worker deadline; timeout → HIGH fallback
    heuristic_gate: true             # confident LOW/HIGH turns skip the classifier
    speculative_worker: true         # overlap the LOW worker with the classifier
    sticky_high: true                # ambiguous turn in a HIGH session → HIGH

provider:
  fallback_model: openai/gpt-oss-120b

tools:
  allow: ["*"]
  deny: []
  mcp_defer: auto

browser:
  channel: auto          # auto | chrome | chromium (auto prefers system Chrome)
  headed: false          # true = visible window (stronger vs bot checks)
  persistent_profile: true
  profile_dir: null      # default: .lattice/browser/profile
  humanize: true         # mouse move + delayed typing on click/type
  type_delay_ms_min: 25
  type_delay_ms_max: 75

scripts:
  languages: [python, node, bash]
  timeout_seconds: 60
  max_timeout_seconds: 300
  allow_network: false
  require_bwrap: false   # true = refuse without bubblewrap (recommended on Linux)

sqlite:
  databases: {}
  query_row_limit: 500
  query_timeout_ms: 5000

telegram:
  tools:
    allow: ["*"]
    deny: []

default_profile: default
